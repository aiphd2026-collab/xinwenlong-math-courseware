const states=DATA.map(()=>({step:0,think:false}));
function render(i){
 const state=states[i],e=document.querySelector(`[data-index="${i}"]`);if(!e)return;
 const q=DATA[i],items=(q.revealSteps||[]);
 e.querySelector('.steps').innerHTML=items.slice(0,state.step).map(x=>{
   const line=String(x.line||'');const eq=line.match(/^\s*[＝=]/);
   const expr=eq?line.replace(/^\s*[＝=]\s*/,''):line;
   return `${x.noteBefore?`<div class="step-explanation">${esc(x.noteBefore)}</div>`:''}<div class="step${x.start?' step-start':''}${x.end?' step-end':''}"><span class="step-label">${x.showLabel?`（${esc(x.label)}）`:''}</span><span class="step-equals">${eq?'＝':''}</span><span class="step-expression">${esc(expr)}</span></div>`;
 }).join('');
 const t=e.querySelector('.thinking');t.hidden=!state.think;
 t.innerHTML=(q.thinking||'').replace(/(审题：|关键第一步：|思路：)/g,'<strong class="think-label">$1</strong>');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const wrap=b.closest('[data-index]');if(!wrap)return;const i=Number(wrap.dataset.index),s=states[i],act=b.dataset.act;if(act==='start')s.step=1;if(act==='next')s.step=Math.min(DATA[i].revealSteps.length,Math.max(1,s.step+1));if(act==='prev')s.step=Math.max(0,s.step-1);if(act==='all')s.step=DATA[i].revealSteps.length;if(act==='clear'){s.step=0;s.think=false}if(act==='think')s.think=!s.think;render(i)});
const n=hashes.indexOf(location.hash);if(n>0)showTab(n);
</script></body></html>
